# Render blueprint: New > Blueprint, pick this repository. Free plan, no card needed.
services:
  - type: web
    name: agentforge-credit-audit
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false   # pasted in the Render dashboard, never committed
      - key: DEMO_AUDITS_PER_HOUR
        value: "8"
